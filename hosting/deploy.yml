# The only way the site is published. Lives in the hosting repository
# (<org>/<org>.github.io), whose Pages source is "GitHub Actions"; a copy is
# kept in the code repository under hosting/.
#
# It builds one commit (dev) or release tag (production) of the code
# repository, writes manifest.json (the commit, the build settings and the
# SHA-256 of every file), attests every file with Sigstore, and deploys. Anyone
# can check the live site against the attestations, and rebuild the same
# commit with the same settings to get the same bytes (scripts/verify-site.sh).
#
# It builds nothing but what was asked for: a tag is checked out by its full
# name and must exist as that tag, the commit must be on RELEASE_BRANCH's own
# (first-parent) history, and the checkout must be exactly the commit the
# request names (CI sends the one it deployed the backend from).
#
# And it only moves forward: the commit must be the live site's commit or
# come after it, and a release tag mustn't be lower than the live one, unless
# the request says rollback: true (hosting/README.md, Rolling back).
#
# Repository variables:
#   CODE_REPOSITORY  e.g. incognitochat/incognitochat
#   REFS             "commits" (dev: commit SHAs on RELEASE_BRANCH) or "tags" (vX.Y.Z)
#   RELEASE_BRANCH   the branch commits must be on, e.g. main
#   API_URL, BOT_USERNAME, APP_NAME, ISSUER_KEY  the client's build settings
#   WS_URL  the push socket (optional; without it the app polls)
#   MEDIA_ORIGIN  the media bucket's origin (optional; without it attachments are off)
#   (ISSUER_KEY names a key published in the code repository's web/issuer-keys.json)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or release tag of the code repository to build
        required: true
        type: string
      commit:
        description: The full commit SHA the ref must resolve to
        required: true
        type: string
      rollback:
        description: Deliberately deploy a build older than the live one (never below v2.4.0)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore signing for the attestations
      attestations: write
    outputs:
      live: ${{ steps.forward.outputs.live }}
    steps:
      # A tag is checked out as refs/tags/vX.Y.Z: given a bare name,
      # actions/checkout takes a branch of that name over the tag.
      - name: Check the requested ref
        id: request
        env:
          REF: ${{ inputs.ref }}
          COMMIT: ${{ inputs.commit }}
          REFS: ${{ vars.REFS }}
        run: |
          case "$REFS" in
            commits) [[ "$REF" =~ ^[0-9a-f]{40}$ ]] && checkout=$REF ;;
            tags) [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && checkout=refs/tags/$REF ;;
            *) false ;;
          esac || { echo "::error::This site only builds ${REFS:-nothing}; got an unexpected ref"; exit 1; }
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The expected commit isn't a full commit SHA"
            exit 1
          fi
          echo "checkout=${checkout}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.CODE_REPOSITORY }}
          ref: ${{ steps.request.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false

      # Before any of the checked-out code runs.
      - name: Check the commit is released
        env:
          REF: ${{ inputs.ref }}
          COMMIT: ${{ inputs.commit }}
          REFS: ${{ vars.REFS }}
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
        run: |
          # A commit or a tag leaves HEAD detached. Without the tag, git would
          # check out a branch made from anything else named refs/tags/vX.Y.Z.
          if git symbolic-ref -q HEAD >/dev/null; then
            echo "::error::The checkout is a branch, not ${REF}"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          case "$REFS" in
            commits) want=$REF ;;
            tags)
              git show-ref --verify --quiet "refs/tags/${REF}" \
                || { echo "::error::There is no tag ${REF}"; exit 1; }
              want=$(git rev-parse --verify "refs/tags/${REF}^{commit}") ;;
            *) want= ;;
          esac
          if [ "$head" != "$want" ]; then
            echo "::error::The checkout (${head}) isn't ${REF}"
            exit 1
          fi
          if [ "$head" != "$COMMIT" ]; then
            echo "::error::The checkout (${head}) isn't the requested commit ${COMMIT}"
            exit 1
          fi
          # On the release branch itself, among its first parents (checkout
          # fetched the full history): a commit that only came in through a
          # merge doesn't count. Fetched and named in full, since
          # "origin/main" would resolve to a tag called that first.
          git fetch --no-tags origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! grep -qxF -- "$head" <(git rev-list --first-parent "refs/remotes/origin/${RELEASE_BRANCH}"); then
            echo "::error::${head} is not on ${RELEASE_BRANCH}"
            exit 1
          fi

      # Only forward: the app's storage on each device only moves forward,
      # and an app older than the one that upgraded it can't open it (below
      # 2.4.0, every user would get a blank app). So the commit must be the
      # live site's or come after it, and a tag mustn't be lower than the
      # live one.
      # The live site is the organization's Pages address, and its
      # manifest.json was written by an earlier run of this workflow. Nothing
      # to compare with (no site yet, or it can't be read) only warns;
      # rollback: true turns the refusals into warnings.
      - name: Check the site only moves forward
        id: forward
        env:
          REF: ${{ inputs.ref }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          back() {
            if [ "$ROLLBACK" = true ]; then
              echo "::warning::Rolling back, as the request asks: $1"
            else
              echo "::error::$1. Only a deliberate rollback goes back: request it with rollback: true"
              exit 1
            fi
          }
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"
          if ! curl -fsS --max-time 30 --retry 3 --max-filesize 1048576 --proto '=https' \
            -o "$RUNNER_TEMP/live.json" "${site}/manifest.json?nocache=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"; then
            echo "::warning::Couldn't read ${site}/manifest.json (no site yet?), so this build isn't compared with the live one"
            exit 0
          fi
          live=$(jq -r --arg re '\A[0-9a-f]{40}\z' '.commit | select(type == "string" and test($re))' \
            "$RUNNER_TEMP/live.json" 2>/dev/null || true)
          live_ref=$(jq -r --arg re '\Av[0-9]+\.[0-9]+\.[0-9]+\z' '.ref | select(type == "string" and test($re))' \
            "$RUNNER_TEMP/live.json" 2>/dev/null || true)
          if [ -z "$live" ]; then
            echo "::warning::${site}/manifest.json names no commit, so this build isn't compared with the live one"
            exit 0
          fi
          echo "live=${live}" >> "$GITHUB_OUTPUT"
          head=$(git rev-parse HEAD)
          echo "Live: ${live_ref:-$live} (commit ${live}). This build: ${REF} (commit ${head})"
          if [ "$head" = "$live" ]; then
            echo "The same commit as the live site"
          elif ! git cat-file -e "${live}^{commit}" 2>/dev/null; then
            back "The live site's commit ${live} isn't in the code repository, so this build can't be shown to come after it"
          elif ! git merge-base --is-ancestor "$live" "$head"; then
            back "${head} doesn't come after the live site's commit ${live}"
          fi
          if [[ $REF == v* && -n $live_ref && $REF != "$live_ref" ]] \
            && [ "$(printf '%s\n' "${REF#v}" "${live_ref#v}" | sort -V | head -n 1)" = "${REF#v}" ]; then
            back "${REF} is lower than the live site's ${live_ref}"
          fi

      # No dependency cache: this job is the site's root of trust.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      - name: Install
        working-directory: web
        run: |
          npm ci
          npm audit signatures

      - name: Build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          VITE_APP_NAME: ${{ vars.APP_NAME }}
          VITE_ISSUER_KEY: ${{ vars.ISSUER_KEY }}
          VITE_WS_URL: ${{ vars.WS_URL }}
          VITE_MEDIA_ORIGIN: ${{ vars.MEDIA_ORIGIN }}
        run: npm run build

      - name: Write the manifest
        working-directory: web/dist
        env:
          REF: ${{ inputs.ref }}
          CODE_REPOSITORY: ${{ vars.CODE_REPOSITORY }}
          API_URL: ${{ vars.API_URL }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          APP_NAME: ${{ vars.APP_NAME }}
          ISSUER_KEY: ${{ vars.ISSUER_KEY }}
          WS_URL: ${{ vars.WS_URL }}
          MEDIA_ORIGIN: ${{ vars.MEDIA_ORIGIN }}
        run: |
          find . -type f | sed 's|^\./||' | sort | while read -r f; do
            printf '%s\t%s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"
          done > "$RUNNER_TEMP/files.tsv"
          jq -n \
            --arg repository "$CODE_REPOSITORY" --arg ref "$REF" --arg commit "$(git rev-parse HEAD)" \
            --arg node "$(node --version)" \
            --arg apiUrl "$API_URL" --arg botUsername "$BOT_USERNAME" --arg appName "$APP_NAME" --arg issuerKey "$ISSUER_KEY" \
            --arg wsUrl "$WS_URL" --arg mediaOrigin "$MEDIA_ORIGIN" \
            --rawfile files "$RUNNER_TEMP/files.tsv" \
            '{repository: $repository, ref: $ref, commit: $commit, node: $node,
              build: ({VITE_API_URL: $apiUrl, VITE_BOT_USERNAME: $botUsername, VITE_APP_NAME: $appName, VITE_ISSUER_KEY: $issuerKey}
                + (if $wsUrl == "" then {} else {VITE_WS_URL: $wsUrl} end)
                + (if $mediaOrigin == "" then {} else {VITE_MEDIA_ORIGIN: $mediaOrigin} end)),
              files: ($files | split("\n") | map(select(length > 0) | split("\t") | {key: .[0], value: .[1]}) | from_entries)}' \
            > manifest.json
          cat manifest.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: web/dist/**

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The build was compared with the site as it was then. This job re-run
      # on its own, after another build has gone live, would put the older
      # one back.
      - name: Check the site hasn't moved since the build
        env:
          CHECKED: ${{ needs.build.outputs.live }}
          COMMIT: ${{ inputs.commit }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          [ "$ROLLBACK" != true ] || exit 0
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"
          live=$(curl -fsS --max-time 30 --retry 3 --max-filesize 1048576 --proto '=https' \
            "${site}/manifest.json?nocache=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}" \
            | jq -r --arg re '\A[0-9a-f]{40}\z' '.commit | select(type == "string" and test($re))' 2>/dev/null || true)
          if [ -z "$live" ] || [ -z "$CHECKED" ]; then
            echo "::warning::Couldn't check that the live site is still the one the build was compared with"
          elif [ "$live" != "$CHECKED" ] && [ "$live" != "$COMMIT" ]; then
            echo "::error::The live site moved from ${CHECKED} to ${live} after the build was compared with it; start a new run"
            exit 1
          fi

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
