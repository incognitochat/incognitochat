# Deploys one environment: the backend (Terraform, the deploy role's
# least-privilege OIDC credentials), smoke tests, then the client through the
# environment's hosting repository. Called by ci.yml: dev for every push to
# main, production for every published release (see docs/deployment.md).
name: Deploy an environment

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which also names the AWS resources (dev, production)
        required: true
        type: string
      site-ref:
        description: What the hosting repository builds (a commit SHA for dev, the release tag for production)
        required: true
        type: string
      bundles:
        description: The SHA-256 of each Lambda bundle as the backend job built it (sha256sum's lines)
        required: true
        type: string

permissions: {}

env:
  TERRAFORM_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC token for AWS (no stored AWS keys), and Sigstore signing
      attestations: write
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check environment configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ISSUER_KEY: ${{ secrets.ISSUER_KEY }}
          MEDIA_ISSUER_KEY: ${{ secrets.MEDIA_ISSUER_KEY }}
          PREVIOUS_ISSUER_KEY: ${{ secrets.PREVIOUS_ISSUER_KEY }}
          PREVIOUS_MEDIA_ISSUER_KEY: ${{ secrets.PREVIOUS_MEDIA_ISSUER_KEY }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLIENT_ORIGINS: ${{ vars.CLIENT_ORIGINS }}
          PAGES_REPO: ${{ vars.PAGES_REPO }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          PAGES_DISPATCH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          LAMBDA_BUILDS_BUCKET: ${{ secrets.LAMBDA_BUILDS_BUCKET }}
          LAMBDA_SIGNING_PROFILE: ${{ secrets.LAMBDA_SIGNING_PROFILE }}
          LAMBDA_CODE_SIGNING_CONFIG: ${{ secrets.LAMBDA_CODE_SIGNING_CONFIG }}
          SECRETS_VERSION: ${{ vars.SECRETS_VERSION }}
        run: |
          missing=0
          for name in BOT_TOKEN ISSUER_KEY MEDIA_ISSUER_KEY AWS_ROLE_ARN AWS_ACCOUNT_ID TF_STATE_BUCKET AWS_REGION CLIENT_ORIGINS \
            PAGES_REPO PAGES_URL PAGES_DISPATCH_TOKEN LAMBDA_BUILDS_BUCKET LAMBDA_SIGNING_PROFILE LAMBDA_CODE_SIGNING_CONFIG; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the ${ENVIRONMENT} environment"
              missing=1
            fi
          done
          # Catch a mis-pasted secret before anything is written to AWS.
          if [ -n "$BOT_TOKEN" ] && ! [[ "$BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo "::error::BOT_TOKEN doesn't look like a Telegram bot token"
            missing=1
          fi
          # The previous keys are set only while a rotation lasts
          # (docs/deployment.md, Rotating an issuer key). Each key is read
          # and checked, and the keys compared, once the code is checked out
          # (Check the issuer keys).
          for name in ISSUER_KEY MEDIA_ISSUER_KEY PREVIOUS_ISSUER_KEY PREVIOUS_MEDIA_ISSUER_KEY; do
            if [ -n "${!name}" ] && [[ "${!name}" != "-----BEGIN PRIVATE KEY-----"* ]]; then
              echo "::error::$name isn't a PKCS#8 PEM private key"
              missing=1
            fi
          done
          # Retired: it replaced all four generated secrets at once, the
          # Telegram-ID pepper too. Each has its own version now, 1 while
          # unset, so ignoring a value other than 1 would replace them all.
          if [ -n "$SECRETS_VERSION" ]; then
            where="SECRETS_VERSION is retired, but the ${ENVIRONMENT} environment still gets it (a variable of the environment, the repository or the organization)"
            if [ "$SECRETS_VERSION" = 1 ]; then
              echo "::error::${where}. It is 1, as each secret's own version is while unset: deleting it is enough"
            else
              echo "::error::${where}. First set SESSION_KEY_VERSION, WEBHOOK_SECRET_VERSION, CHAT_KEY_VERSION and TELEGRAM_ID_PEPPER_VERSION to ${SECRETS_VERSION} where it is set, so that no secret is replaced, then delete it (docs/deployment.md, Replacing a generated secret)"
            fi
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The release tag must point at this commit (GITHUB_SHA), and the
      # commit must be on main itself, among its first parents: one that only
      # came in through a merge doesn't count. The hosting repository checks
      # both again on its own checkout before it builds the tag, against the
      # commit sent with the request (below). Full ref names: "origin/main"
      # would resolve to a tag called that before the branch.
      - name: Check the release is on main
        if: inputs.environment == 'production'
        env:
          SITE_REF: ${{ inputs.site-ref }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${SITE_REF}" \
            || [ "$(git rev-parse --verify "refs/tags/${SITE_REF}^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::The release tag doesn't point at this commit"
            exit 1
          fi
          grep -qxF -- "$GITHUB_SHA" <(git rev-list --first-parent refs/remotes/origin/main) \
            || { echo "::error::This release isn't a commit on main"; exit 1; }

      # The site's workflow (hosting/deploy.yml) is copied into the hosting
      # repository by hand, and refuses a request with an input it doesn't
      # declare. That request comes last, after the backend is deployed, so
      # check before deploying anything that the copy takes `commit`. The
      # hosting repository is public: this job's own token can read it.
      - name: Check the site's workflow takes this request
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPO: ${{ vars.PAGES_REPO }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/${PAGES_REPO}/contents/.github/workflows/deploy.yml" \
            > "$RUNNER_TEMP/site-deploy.yml" \
            || { echo "::error::Couldn't read the hosting repository's deploy.yml"; exit 1; }
          if ! yq -e '.on.workflow_dispatch.inputs | has("commit")' "$RUNNER_TEMP/site-deploy.yml" >/dev/null; then
            echo "::error::The hosting repository's deploy.yml doesn't take a commit input; copy hosting/deploy.yml there first"
            exit 1
          fi

      # Before anything changes (docs/deployment.md, Rotating an issuer key):
      # - each key is one the API can load (an RSA-2048 key that openssl
      #   reads and checks), and no two are the same key: one key for both
      #   kinds would give them one budget, and the API refuses that at
      #   startup;
      # - the current keys are published together, as one entry of
      #   web/issuer-keys.json, so the site can switch to them;
      # - the keys the live site names stay held, unless DROP_LIVE_ISSUER_KEY
      #   is true (after a leak): otherwise its open apps get no tokens.
      # The IDs of the keys the API will hold, current first, are kept for
      # the checks after the deploy. Key IDs are public.
      - name: Check the issuer keys
        env:
          ISSUER_KEY: ${{ secrets.ISSUER_KEY }}
          MEDIA_ISSUER_KEY: ${{ secrets.MEDIA_ISSUER_KEY }}
          PREVIOUS_ISSUER_KEY: ${{ secrets.PREVIOUS_ISSUER_KEY }}
          PREVIOUS_MEDIA_ISSUER_KEY: ${{ secrets.PREVIOUS_MEDIA_ISSUER_KEY }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          DROP_LIVE_ISSUER_KEY: ${{ vars.DROP_LIVE_ISSUER_KEY }}
        run: |
          set -o pipefail
          names=(ISSUER_KEY MEDIA_ISSUER_KEY PREVIOUS_ISSUER_KEY PREVIOUS_MEDIA_ISSUER_KEY)
          declare -A id
          for name in "${names[@]}"; do
            [ -n "${!name}" ] || continue
            text=$(printf '%s\n' "${!name}" | openssl pkey -noout -text_pub 2>/dev/null || true)
            if ! printf '%s\n' "${!name}" | openssl pkey -noout -check >/dev/null 2>&1 \
              || [[ "$text" != "Public-Key: (2048 bit)"$'\n'"Modulus:"* ]]; then
              echo "::error::$name isn't an RSA private key of 2048 bits that openssl can read and check"
              exit 1
            fi
            # The SHA-256 of the public key's SubjectPublicKeyInfo (DER), as published.
            id[$name]=$(printf '%s\n' "${!name}" | openssl pkey -pubout -outform DER | sha256sum | cut -d' ' -f1)
          done
          for ((i = 0; i < ${#names[@]}; i++)); do
            for ((j = i + 1; j < ${#names[@]}; j++)); do
              a=${names[i]} b=${names[j]}
              if [ -n "${id[$a]:-}" ] && [ "${id[$a]}" = "${id[$b]:-}" ]; then
                echo "::error::$a and $b are the same key (key ID ${id[$a]}); they must be different keys"
                exit 1
              fi
            done
          done

          send=${id[ISSUER_KEY]} media=${id[MEDIA_ISSUER_KEY]}
          entry=$(jq -r --arg send "$send" --arg media "$media" \
            '[to_entries[] | select(.value | type == "object") | select(.value.keyId == $send and .value.media.keyId == $media) | .key][0] // empty' \
            web/issuer-keys.json)
          if [ -z "$entry" ]; then
            echo "::error::No entry of web/issuer-keys.json has ISSUER_KEY's public key (key ID ${send}) with MEDIA_ISSUER_KEY's (${media}) under media: publish them first (docs/deployment.md, Rotating an issuer key)"
            exit 1
          fi
          echo "The current issuer keys are published as ${entry}"
          held_send="$send${id[PREVIOUS_ISSUER_KEY]:+ ${id[PREVIOUS_ISSUER_KEY]}}"
          held_media="$media${id[PREVIOUS_MEDIA_ISSUER_KEY]:+ ${id[PREVIOUS_MEDIA_ISSUER_KEY]}}"
          echo "The API will hold the send keys ${held_send} and the media keys ${held_media}"
          { echo "HELD_SEND_KEY_IDS=${held_send}"; echo "HELD_MEDIA_KEY_IDS=${held_media}"; } >> "$GITHUB_ENV"

          manifest=$(curl -sS --max-time 10 "${PAGES_URL%/}/manifest.json?v=${GITHUB_SHA}-${RANDOM}" || true)
          live=$(jq -r '.build.VITE_ISSUER_KEY // empty' <<<"$manifest" 2>/dev/null || true)
          if [ -z "$live" ]; then
            echo "::warning::Couldn't read the live site's manifest (none yet?): the keys it names aren't checked"
            exit 0
          fi
          live_send=$(jq -r --arg name "$live" '.[$name] | objects | .keyId // empty' web/issuer-keys.json)
          live_media=$(jq -r --arg name "$live" '.[$name] | objects | .media.keyId // empty' web/issuer-keys.json)
          if [ -n "$live_send" ] && [[ " $held_send " == *" $live_send "* ]] \
            && { [ -z "$live_media" ] || [[ " $held_media " == *" $live_media "* ]]; }; then
            echo "The live site names ${live}, whose keys stay held"
            if [ "$DROP_LIVE_ISSUER_KEY" = true ]; then
              echo "::warning::DROP_LIVE_ISSUER_KEY is set but not needed: delete it"
            fi
          elif [ "$DROP_LIVE_ISSUER_KEY" = true ]; then
            echo "::warning::The live site names ${live}, whose keys this deploy drops (DROP_LIVE_ISSUER_KEY): its open apps get no tokens until they load the new build. Delete DROP_LIVE_ISSUER_KEY afterwards"
          elif [ -z "$live_send" ]; then
            echo "::error::The live site names ${live}, which this commit doesn't publish, so its keys can't be checked. Keep the entry until no site names it; after a leak, set DROP_LIVE_ISSUER_KEY to true for this deploy"
            exit 1
          else
            echo "::error::The live site names ${live}, whose keys the API wouldn't hold after this deploy, so its open apps would get no tokens. Keep them as the previous keys until the site serves the new entry; after a leak, set DROP_LIVE_ISSUER_KEY to true for this deploy (docs/deployment.md, Rotating an issuer key)"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-bundles
          path: backend/dist

      # Exactly the bundles the backend job built, before anything attests or
      # deploys them: any job of the run could replace the artifact, but not
      # the backend job's outputs, which carry the hashes (ci.yml).
      - name: Check the bundles are the backend job's
        working-directory: backend/dist
        env:
          BUNDLES: ${{ inputs.bundles }}
        run: |
          built=$(sed '/^$/d' <<<"$BUNDLES" | sort)
          if [ -z "$built" ] || grep -vqE '^[0-9a-f]{64}  [a-z0-9_-]+\.zip$' <<<"$built"; then
            echo "::error::The backend job's bundle hashes are missing or malformed"
            exit 1
          fi
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::No bundles were downloaded"
            exit 1
          fi
          if ! diff <(echo "$built") <(sha256sum -- "${zips[@]}" | sort); then
            echo "::error::The downloaded bundles aren't the ones the backend job built (< built, > downloaded)"
            exit 1
          fi
          echo "The bundles are the ones the backend job built:"
          echo "$built"

      # Public, signed provenance for the function builds about to be
      # deployed. The builds are reproducible, so anyone can rebuild this
      # commit and compare (docs/verifying.md).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: backend/dist/*.zip

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800

      # Before anything changes: the Lambda permissions boundary, which only
      # an admin applies (infra/init), must let the functions call each
      # other as this code does, or the deploy would leave sends succeeding
      # while pushes and notices stopped. Checked on the existing roles, as
      # if their own policies allowed every invoke, so only the boundary
      # decides; skipped on a first deploy, which the check after applying
      # covers.
      - name: Check the permissions boundary is up to date
        run: scripts/check-function-roles.sh boundary "incognitochat-${ENVIRONMENT}"

      # Likewise the deploy role itself: it must be denied what a deploy
      # never needs (reading user data, and leaving access behind that no
      # plan would show), and still be allowed what this workflow does with
      # the functions. An older infra/init stops the deploy here.
      - name: Check the deploy role's limits
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: scripts/check-function-roles.sh deploy-role "$AWS_ROLE_ARN" "incognitochat-${ENVIRONMENT}"

      - name: Terraform init
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      # Workflow logs are public. Hide the endpoints of earlier deploys before
      # Terraform prints anything (there are none on the first deploy): the
      # function URL and CloudFront's too, which a plan prints when the
      # distribution's origin changes, whichever one api_url names.
      - name: Mask endpoints
        working-directory: infra
        run: |
          for name in api_url api_function_url api_cloudfront_url ws_url webhook_url media_origin; do
            value=$(terraform output -raw "$name" 2>/dev/null || true)
            if [ -n "$value" ]; then
              echo "::add-mask::${value}"
              host=${value#*://}
              echo "::add-mask::${host%%[/.]*}"
            fi
          done

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_bot_token: ${{ secrets.BOT_TOKEN }}
          TF_VAR_bot_token_version: ${{ vars.BOT_TOKEN_VERSION || '1' }}
          TF_VAR_issuer_key: ${{ secrets.ISSUER_KEY }}
          TF_VAR_issuer_key_version: ${{ vars.ISSUER_KEY_VERSION || '1' }}
          TF_VAR_media_issuer_key: ${{ secrets.MEDIA_ISSUER_KEY }}
          TF_VAR_media_issuer_key_version: ${{ vars.MEDIA_ISSUER_KEY_VERSION || '1' }}
          # Held only while a rotation lasts; unset, empty, which is none.
          TF_VAR_previous_issuer_key: ${{ secrets.PREVIOUS_ISSUER_KEY }}
          TF_VAR_previous_issuer_key_version: ${{ vars.PREVIOUS_ISSUER_KEY_VERSION || '1' }}
          TF_VAR_previous_media_issuer_key: ${{ secrets.PREVIOUS_MEDIA_ISSUER_KEY }}
          TF_VAR_previous_media_issuer_key_version: ${{ vars.PREVIOUS_MEDIA_ISSUER_KEY_VERSION || '1' }}
          # One version per generated secret (docs/deployment.md, Replacing a
          # generated secret).
          TF_VAR_session_key_version: ${{ vars.SESSION_KEY_VERSION || '1' }}
          TF_VAR_webhook_secret_version: ${{ vars.WEBHOOK_SECRET_VERSION || '1' }}
          TF_VAR_chat_key_version: ${{ vars.CHAT_KEY_VERSION || '1' }}
          TF_VAR_telegram_id_pepper_version: ${{ vars.TELEGRAM_ID_PEPPER_VERSION || '1' }}
          TF_VAR_client_origins: ${{ vars.CLIENT_ORIGINS }}
          TF_VAR_deletion_protection: ${{ vars.DELETION_PROTECTION || 'true' }}
          TF_VAR_invite_only: ${{ vars.INVITE_ONLY || 'true' }}
          # off, dry-run or on (docs/deployment.md, Account expiry).
          TF_VAR_account_expiry: ${{ vars.ACCOUNT_EXPIRY || 'dry-run' }}
          TF_VAR_reserve_concurrency: ${{ vars.RESERVE_CONCURRENCY || 'false' }}
          TF_VAR_api_access: ${{ vars.API_ACCESS || 'direct' }}
          TF_VAR_firewall: ${{ vars.FIREWALL || 'false' }}
          # A secret, so that it is masked in these public logs; unset, empty,
          # which is no admins. It goes to SSM alone, written like the keys
          # above only when its version rises.
          TF_VAR_admin_telegram_ids: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          TF_VAR_admin_telegram_ids_version: ${{ vars.ADMIN_TELEGRAM_IDS_VERSION || '1' }}
          # Code signing, from infra/init.
          TF_VAR_lambda_builds_bucket: ${{ secrets.LAMBDA_BUILDS_BUCKET }}
          TF_VAR_lambda_signing_profile: ${{ secrets.LAMBDA_SIGNING_PROFILE }}
          TF_VAR_lambda_code_signing_config_arn: ${{ secrets.LAMBDA_CODE_SIGNING_CONFIG }}
          # Limits, tunable without a code change (docs/deployment.md). Each
          # goes to Terraform as TF_VAR_<lower-case name> only when it is set:
          # an empty value isn't a number, and unset, infra/variables.tf's
          # default applies.
          TABLE_MAX_READ_UNITS: ${{ vars.TABLE_MAX_READ_UNITS }}
          TABLE_MAX_WRITE_UNITS: ${{ vars.TABLE_MAX_WRITE_UNITS }}
          FIREWALL_RATE_LIMIT: ${{ vars.FIREWALL_RATE_LIMIT }}
          FIREWALL_ANONYMOUS_RATE_LIMIT: ${{ vars.FIREWALL_ANONYMOUS_RATE_LIMIT }}
          FIREWALL_LOOKUPS_TOTAL_LIMIT: ${{ vars.FIREWALL_LOOKUPS_TOTAL_LIMIT }}
          WS_THROTTLE_RATE_LIMIT: ${{ vars.WS_THROTTLE_RATE_LIMIT }}
          WS_THROTTLE_BURST_LIMIT: ${{ vars.WS_THROTTLE_BURST_LIMIT }}
          LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS }}
        # Refreshed resources are printed with their IDs (such as the media
        # bucket's name): hidden, as in apply.
        run: |
          set -o pipefail
          for name in TABLE_MAX_READ_UNITS TABLE_MAX_WRITE_UNITS FIREWALL_RATE_LIMIT FIREWALL_ANONYMOUS_RATE_LIMIT \
            FIREWALL_LOOKUPS_TOTAL_LIMIT WS_THROTTLE_RATE_LIMIT WS_THROTTLE_BURST_LIMIT LOG_RETENTION_DAYS; do
            if [ -n "${!name}" ]; then
              export "TF_VAR_${name,,}=${!name}"
            fi
          done
          terraform plan -no-color -out=tfplan | sed -E 's/\[id=[^]]*\]/[id=***]/'

      - name: Terraform apply
        working-directory: infra
        env:
          # Ephemeral variables aren't saved in the plan file; supply them again.
          TF_VAR_bot_token: ${{ secrets.BOT_TOKEN }}
          TF_VAR_issuer_key: ${{ secrets.ISSUER_KEY }}
          TF_VAR_media_issuer_key: ${{ secrets.MEDIA_ISSUER_KEY }}
          TF_VAR_previous_issuer_key: ${{ secrets.PREVIOUS_ISSUER_KEY }}
          TF_VAR_previous_media_issuer_key: ${{ secrets.PREVIOUS_MEDIA_ISSUER_KEY }}
          TF_VAR_admin_telegram_ids: ${{ secrets.ADMIN_TELEGRAM_IDS }}
        # Resource IDs (such as the WebSocket API's) are printed on creation.
        # pipefail: without it, a failed apply would pass through sed as a success.
        run: |
          set -o pipefail
          terraform apply -no-color tfplan | sed -E 's/\[id=[^]]*\]/[id=***]/'

      # Fetches the code each function runs from Lambda and checks it is the
      # attested build plus AWS Signer's signature, run as the app stack sets
      # it (a .zip, no layers, provided.al2023 on arm64, handler bootstrap);
      # prints both hashes.
      - name: Check the deployed code
        run: python3 scripts/check-lambda-deploy.py backend/dist "incognitochat-${ENVIRONMENT}"

      # And after applying: each function's role, its own policy and the
      # boundary together, must allow every call the functions make to each
      # other (Terraform's permission_checks output), first deploys included.
      - name: Check the functions may call each other
        working-directory: infra
        run: |
          set -o pipefail
          terraform output -json permission_checks | ../scripts/check-function-roles.sh roles

      # Whom each function's resource policy lets invoke it: only what the
      # app stack sets. IAM can't keep the deploy role from naming another
      # account's CloudFront or API Gateway, or letting anyone invoke api or
      # bot directly, so each deploy checks what earlier ones left.
      - name: Check who may invoke the functions
        working-directory: infra
        run: |
          set -o pipefail
          terraform output -json invoke_sources | ../scripts/check-function-roles.sh policies "incognitochat-${ENVIRONMENT}"

      - name: Read endpoints
        working-directory: infra
        run: |
          for name in api_url api_function_url ws_url webhook_url media_origin; do
            value=$(terraform output -raw "$name")
            echo "::add-mask::${value}"
            host=${value#*://}
            echo "::add-mask::${host%%[/.]*}"
            echo "$(echo "$name" | tr '[:lower:]' '[:upper:]')=${value}" >> "$GITHUB_ENV"
          done
          echo "API_LOCKED=$(terraform output -raw api_locked)" >> "$GITHUB_ENV"

      # The bot registers its own webhook (with its secret) and menu button,
      # so the calls to Telegram are made inside the function, not here. The
      # secrets still reach this job: the bot token and the issuer keys go to
      # the checks and Terraform steps above, and Terraform makes the
      # generated ones, the webhook secret among them (docs/deployment.md,
      # Secrets at rest). Right after the checks of what was deployed,
      # before the smoke tests: after a new webhook secret
      # (WEBHOOK_SECRET_VERSION), the bot refuses every update until this
      # step has run, so a failed smoke test mustn't leave it that way.
      - name: Set up the bot
        working-directory: infra
        run: |
          function=$(terraform output -raw bot_function_name)
          payload=$(jq -nc --arg url "$WEBHOOK_URL" '{setup: {webhookUrl: $url}}')
          failed=$(aws lambda invoke --function-name "$function" --cli-binary-format raw-in-base64-out \
            --payload "$payload" --query FunctionError --output text "$RUNNER_TEMP/bot-setup.json")
          if [ "$failed" != "None" ] || ! jq -e '.ok == true' "$RUNNER_TEMP/bot-setup.json" >/dev/null; then
            echo "::error::Bot setup failed"
            exit 1
          fi
          echo "Webhook and menu button are set"

      # The bot's /start command, description and short description in each
      # of the app's languages (backend/internal/i18n): the function reads
      # each and sets only those that differ. Telegram keeps them between
      # deploys, so a failure here (its flood control, say) leaves the bot
      # working with the texts it had, and the next deploy tries again: a
      # warning, not a failed deploy.
      - name: Set the bot's texts
        working-directory: infra
        run: |
          function=$(terraform output -raw bot_function_name)
          failed=$(aws lambda invoke --function-name "$function" --cli-binary-format raw-in-base64-out \
            --payload '{"texts":{}}' --query FunctionError --output text "$RUNNER_TEMP/bot-texts.json") || failed=invoke
          report=$(jq -c '{ok, set, unchanged, failed}' "$RUNNER_TEMP/bot-texts.json" 2>/dev/null || echo '{}')
          echo "Bot texts: $report"
          if [ "$failed" != "None" ] || ! jq -e '.ok == true' "$RUNNER_TEMP/bot-texts.json" >/dev/null 2>&1; then
            echo "::warning::Some of the bot's texts weren't set ($report); the next deploy tries again"
          fi

      - name: Smoke test – API answers with JSON errors
        run: |
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' "${API_URL%/}/no-such-route")
          status=${body##*$'\n'}
          if [ "$status" != "404" ] || [[ "$body" != *'"error":"not_found"'* ]]; then
            echo "::error::Expected a 404 JSON error from the API, got HTTP ${status}"
            exit 1
          fi
          echo "API reachable (HTTP 404 with a JSON error)"

      # Behind CloudFront alone, the function URL must refuse a direct call
      # (Lambda answers 403 itself, without running the function).
      - name: Smoke test – the function URL answers CloudFront alone
        if: env.API_LOCKED == 'true'
        run: |
          status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${API_FUNCTION_URL%/}/no-such-route")
          if [ "$status" != "403" ]; then
            echo "::error::Expected the function URL to refuse a direct call with 403, got HTTP ${status}"
            exit 1
          fi
          echo "The function URL refuses direct calls (HTTP 403)"

      # A login for a device that doesn't exist: the function must have loaded
      # its parameters and be able to read the directory table to refuse it.
      - name: Smoke test – API refuses an unknown device
        run: |
          rand_id() { head -c 16 /dev/urandom | basenc -w0 --base64url | tr -d "="; }
          payload=$(printf '{"account":"%s","device":"%s","timestamp":%d,"nonce":"%s","signature":"%s"}' \
            "$(rand_id)" "$(rand_id)" "$(date +%s)" "$(rand_id)" "$(head -c 64 /dev/zero | basenc -w0 --base64url | tr -d "=")")
          # The body's hash: Lambda needs it once CloudFront signs requests.
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' -H 'Content-Type: application/json' \
            -H "x-amz-content-sha256: $(printf '%s' "$payload" | sha256sum | cut -d' ' -f1)" \
            -d "$payload" "${API_URL%/}/session")
          status=${body##*$'\n'}
          if [ "$status" != "401" ] || [[ "$body" != *'"error":"login_refused"'* ]]; then
            echo "::error::Expected 401 login_refused from POST /session, got HTTP ${status}"
            exit 1
          fi
          echo "API loaded its configuration and reads the directory (HTTP 401 login_refused)"

      # A send without a token: the API must have loaded its issuer key to
      # get this far, and refuses it after checking the envelope.
      - name: Smoke test – sends need a token
        run: |
          envelope=$(head -n 1 backend/internal/envelope/testdata/client-envelopes.hex | tr -d '\n' | tr a-f A-F | basenc --base16 -d | basenc -w0 --base64url | tr -d '=')
          mailbox=$(head -c 16 /dev/urandom | basenc -w0 --base64url | tr -d '=')
          payload="{\"mailbox\":\"${mailbox}\",\"envelope\":\"${envelope}\"}"
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' -H 'Content-Type: application/json' \
            -H "x-amz-content-sha256: $(printf '%s' "$payload" | sha256sum | cut -d' ' -f1)" \
            -d "$payload" "${API_URL%/}/send")
          status=${body##*$'\n'}
          if [ "$status" != "401" ] || [[ "$body" != *'"error":"invalid_token"'* ]]; then
            echo "::error::Expected 401 invalid_token from POST /send without a token, got HTTP ${status}"
            exit 1
          fi
          echo "Sends need a token (HTTP 401 invalid_token)"

      # What the API actually loaded, not what the secrets say: a changed
      # secret reaches SSM only when its version is raised. The same keys,
      # the current one first (HELD_*_KEY_IDS, from Check the issuer keys).
      - name: Smoke test – the API holds the expected issuer keys
        run: |
          set -o pipefail
          keys=$(curl -sS --fail --max-time 30 "${API_URL%/}/tokens/keys")
          # Unpadded base64url to hex, the form issuer-keys.json uses.
          hex() { local s=$1; while (( ${#s} % 4 )); do s+='='; done; printf '%s' "$s" | basenc --base64url -d | od -An -v -tx1 | tr -d ' \n'; }
          held() { jq -r --arg kind "$1" '.[$kind][]?' <<<"$keys" | while read -r id; do hex "$id"; echo; done | paste -sd' ' -; }
          send=$(held send)
          media=$(held media)
          if [ "$send" != "$HELD_SEND_KEY_IDS" ] || [ "$media" != "$HELD_MEDIA_KEY_IDS" ]; then
            echo "::error::The API holds the send keys '${send}' and the media keys '${media}', not '${HELD_SEND_KEY_IDS}' and '${HELD_MEDIA_KEY_IDS}' as the secrets say: raise the version of each issuer key secret that changed (docs/deployment.md, Rotating an issuer key)"
            exit 1
          fi
          echo "The API holds the expected issuer keys"

      - name: Smoke test – webhook is reachable
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST -d '{}' "$WEBHOOK_URL")
          if [ "$status" != "404" ]; then
            echo "::error::Expected HTTP 404 from the webhook without its secret, got ${status}"
            exit 1
          fi
          echo "Webhook reachable (HTTP 404 without its secret)"

      - name: Smoke test – the notify function starts and may read notices
        working-directory: infra
        run: |
          # The check event has the function read its parameters, then make
          # its directory calls (a read of the notice fields, and both
          # writes) for a random account that doesn't exist, under its
          # narrowed role: a refusal fails the invocation. Nothing changes,
          # since the account isn't there. IAM's simulator can't check
          # these calls' conditions (which items and attributes).
          function=$(terraform output -raw notify_function_name)
          failed=$(aws lambda invoke --function-name "$function" --cli-binary-format raw-in-base64-out \
            --payload '{"check":{}}' --query FunctionError --output text "$RUNNER_TEMP/notify.json")
          if [ "$failed" != "None" ]; then
            echo "::error::The notify function failed, or its role refused its directory calls"
            exit 1
          fi
          echo "The notify function starts, and its role allows its directory calls"

      - name: Smoke test – sockets refuse unauthenticated connections
        run: |
          # Without a session token, and with a forged one (the ws function
          # must start and check it).
          for protocols in "" "v1, v1.forged.token"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --http1.1 \
              -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' \
              -H 'Sec-WebSocket-Key: c21va2UtdGVzdC1rZXktMQ==' ${protocols:+-H "Sec-WebSocket-Protocol: ${protocols}"} \
              "https://${WS_URL#wss://}")
            if [ "$status" != "403" ]; then
              echo "::error::Expected HTTP 403 for a socket with protocols '${protocols}', got ${status}"
              exit 1
            fi
          done
          echo "Sockets refuse unauthenticated connections (HTTP 403)"

      # The client is built, attested and deployed by the site's own workflow
      # (hosting/deploy.yml, kept in that repository), from this very commit:
      # dev builds the commit, production its release tag. It is sent the
      # commit too, and refuses to build anything else, or anything older
      # than the live site unless asked for rollback: true (never from here).
      # The token can't change the hosting repository's files or settings,
      # but it can start that workflow with any inputs, re-run, cancel and
      # delete its runs, and turn it off (hosting/README.md).
      - name: Ask the site to build this commit
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          PAGES_REPO: ${{ vars.PAGES_REPO }}
          SITE_REF: ${{ inputs.site-ref }}
        run: gh workflow run deploy.yml --repo "$PAGES_REPO" --field ref="$SITE_REF" --field commit="$GITHUB_SHA"

      - name: Wait for the client to go live
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          for _ in $(seq 1 60); do
            manifest=$(curl -sS --max-time 10 "${PAGES_URL%/}/manifest.json?v=${GITHUB_SHA}-${RANDOM}" || true)
            if [ "$(jq -r '.commit // empty' <<<"$manifest" 2>/dev/null)" = "$GITHUB_SHA" ]; then
              if [ "$(jq -r '.build.VITE_API_URL' <<<"$manifest")" != "$API_URL" ]; then
                echo "::error::The site was built for another API; update its API_URL variable"
                exit 1
              fi
              # Apps ask for tokens of the keys their build names: keys the
              # API doesn't hold get them none (HELD_*_KEY_IDS: what the API
              # holds, checked above, the current key first).
              name=$(jq -r '.build.VITE_ISSUER_KEY' <<<"$manifest")
              send=$(jq -r --arg name "$name" '.[$name] | objects | .keyId // empty' web/issuer-keys.json)
              media=$(jq -r --arg name "$name" '.[$name] | objects | .media.keyId // empty' web/issuer-keys.json)
              if [ -z "$send" ] || [[ " ${HELD_SEND_KEY_IDS} " != *" ${send} "* ]] \
                || { [ -n "$media" ] && [[ " ${HELD_MEDIA_KEY_IDS} " != *" ${media} "* ]]; }; then
                echo "::error::The site names issuer keys (${name}) the API doesn't hold, so its apps get no tokens: set the hosting repository's ISSUER_KEY to the entry of the current keys (docs/deployment.md, Rotating an issuer key)"
                exit 1
              fi
              if [ "$send" != "${HELD_SEND_KEY_IDS%% *}" ] || { [ -n "$media" ] && [ "$media" != "${HELD_MEDIA_KEY_IDS%% *}" ]; }; then
                echo "::warning::The site still names the previous issuer keys (${name}): set the hosting repository's ISSUER_KEY to the entry of the current keys and deploy again before retiring them (docs/deployment.md, Rotating an issuer key)"
              fi
              echo "The client built from this commit is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The site didn't serve this commit within 10 minutes"
          exit 1
