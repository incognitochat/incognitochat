version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date. Not
  # hosting/deploy.yml's, nor other pins (docs/development.md, Updating by
  # hand).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # The providers of both stacks: the app (applied by every deploy) and
  # bootstrap.
  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/init
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns: ["*"]
